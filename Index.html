<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EA YOUTH UNION - PREMIUM V2</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --p: #8b0000; --s: #d4af37; --bg: #f8fafc; --txt: #1e293b;
            --glass: rgba(255, 255, 255, 0.85);
            --grad: linear-gradient(135deg, #8b0000 0%, #4a0000 100%);
            --azmach: #8b0000; --getem: #475569;
        }

        .dark-mode {
            --p: #fbbf24; --s: #f59e0b; --bg: #0b0f19; --txt: #f8fafc;
            --glass: rgba(15, 23, 42, 0.85);
            --grad: linear-gradient(135deg, #1e293b 0%, #000000 100%);
            --azmach: #fbbf24; --getem: #cbd5e1;
        }

        .sab-mode { --p: #14532d; --s: #4ade80; --grad: linear-gradient(135deg, #14532d 0%, #064e3b 100%); }

        body { 
            margin: 0; background: var(--bg); color: var(--txt); 
            font-family: 'Noto Sans Ethiopic', sans-serif; transition: 0.5s; overflow-x: hidden; 
        }

        /* የሚንቀሳቀስ Background Animation */
        #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; pointer-events: none; opacity: 0.6; }

        /* Welcome Gate Styles */
        #welcome-gate {
            position: fixed; inset: 0; background: #0f172a; z-index: 100000;
            display: flex; align-items: center; justify-content: center; transition: 1.2s cubic-bezier(0.7, 0, 0.3, 1);
        }
        .welcome-box {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
            padding: 40px 25px; border-radius: 35px; width: 88%; max-width: 360px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .logo-circle {
            width: 70px; height: 70px; background: linear-gradient(135deg, var(--s), #f59e0b); 
            color: #0f172a; border-radius: 22px; display: flex; align-items: center; 
            justify-content: center; margin: 0 auto 20px; font-size: 30px; 
            transform: rotate(-10deg); box-shadow: 0 10px 20px rgba(251, 191, 36, 0.3);
        }
        .input-group {
            background: rgba(255,255,255,0.08); border-radius: 15px;
            display: flex; align-items: center; padding: 5px 15px; margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .input-group i { color: var(--s); width: 25px; font-size: 14px; }
        .input-group input, .input-group select {
            background: none; border: none; color: white; padding: 12px 5px;
            width: 100%; outline: none; font-family: inherit; font-size: 15px;
        }
        .input-group select option { background: #1e293b; }

        .start-btn {
            background: var(--s); color: #0f172a; border: none; padding: 16px;
            width: 100%; border-radius: 18px; font-weight: 700; cursor: pointer;
            font-size: 16px; transition: 0.4s; margin-top: 15px;
            box-shadow: 0 10px 20px rgba(251, 191, 36, 0.2);
        }
        .start-btn:hover { background: white; transform: translateY(-3px); }

        /* News Ticker */
        .ticker-wrap { background: var(--p); color: white; padding: 10px 0; overflow: hidden; position: sticky; top: 0; z-index: 2000; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .ticker { display: inline-block; white-space: nowrap; animation: ticker 25s linear infinite; font-weight: 500; font-size: 15px; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* Main UI Parts */
        header { padding: 15px 20px; background: var(--glass); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .app-logo { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--s); box-shadow: 0 0 15px rgba(212,175,55,0.3); }

        .search-area { padding: 10px 20px; }
        .search-bar { background: var(--glass); border-radius: 50px; padding: 12px 20px; display: flex; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1); }
        .search-bar input { border: none; background: none; outline: none; width: 100%; color: var(--txt); font-family: inherit; font-size: 16px; }

        .lyrics-box { display: none; margin-top: 15px; padding: 20px; background: rgba(0,0,0,0.03); border-radius: 20px; line-height: 2.2; text-align: center; font-size: 18px; }
        .azmach-text { color: var(--azmach); font-weight: bold; font-size: 20px; border-bottom: 1px dashed var(--s); display: inline-block; margin-bottom: 10px; }
        .getem-text { color: var(--getem); }

        .gallery-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 10px; }
        .gallery-card { border-radius: 20px; overflow: hidden; height: 180px; position: relative; box-shadow: 0 8px 20px rgba(0,0,0,0.1); transform: scale(1); transition: 0.4s; }
        .gallery-card img { width: 100%; height: 100%; object-fit: cover; }

        nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 15px 0; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); z-index: 5000; }
        nav i { font-size: 22px; color: #64748b; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        nav i.active { color: var(--s); transform: translateY(-10px) scale(1.3); text-shadow: 0 0 10px var(--s); }

        .page { display: none; padding: 20px 20px 100px; animation: slideUp 0.6s ease; }
        .page.active { display: block; }
        .card { background: var(--glass); padding: 25px; border-radius: 30px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.02); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body id="body">

<div id="welcome-gate">
    <div class="welcome-box">
        <div class="logo-circle">
            <i class="fas fa-chart-line"></i> </div>
        <h2 style="margin-bottom: 5px; color: var(--s); letter-spacing: 1px;">ሰላም! እንኳን መጡ</h2>
        <p style="font-size: 13px; opacity: 0.7; margin-bottom: 20px;">እባክዎ አገልግሎቱን ለመጀመር መረጃዎን ይሙሉ</p>
        
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="reg-name" placeholder="ሙሉ ስም">
        </div>
        
        <div class="input-group">
            <i class="fas fa-hands-praying"></i>
            <select id="reg-faith">
                <option value="" disabled selected>ሃይማኖት</option>
                <option value="Adventist">አድቬንቲስት (Adventist)</option>
                <option value="Orthodox">ኦርቶዶክስ (Orthodox)</option>
                <option value="Protestant">ፕሮቴስታንት (Protestant)</option>
                <option value="Catholic">ካቶሊክ (Catholic)</option>
                <option value="Other">ሌላ (Other)</option>
            </select>
        </div>

        <div class="input-group">
            <i class="fas fa-location-dot"></i>
            <input type="text" id="reg-city" placeholder="ከተማ">
        </div>

        <button onclick="saveAndEnter()" class="start-btn">አገልግሎቱን ጀምር <i class="fas fa-arrow-right" style="margin-left:8px;"></i></button>
    </div>
</div>
<canvas id="bg-canvas"></canvas>

<div class="ticker-wrap">
    <div class="ticker" id="news-ticker">እንኳን በደህና መጡ! EA Youth Union የእርስዎ መንፈሳዊ ረዳት።</div>
</div>

<header>
    <meta property="og:title" content="EA Youth Union">
    <meta property="og:description" content="መንፈሳዊ መዝሙሮች፣ ትምህርቶች እና የቀጥታ ስርጭት በአንድ ላይ።">
    <meta property="og:image" content="https://your-github-link.io/logo.png">
    <meta property="og:type" content="website">

    <img src="" id="app-logo" class="app-logo">
    <h3 id="app-title" style="margin:0; color:var(--p);">EA PRO</h3>
    <div onclick="toggleTheme()" style="cursor:pointer; width:40px; text-align:right;">
        <i class="fas fa-circle-half-stroke" style="color:var(--s); font-size:22px;"></i>
    </div>
</header>

<div id="home" class="page active">
    <div class="card" style="background:var(--grad); color:white; border:none; text-align:center; position:relative; overflow:hidden;">
        <i class="fas fa-dove" style="font-size:40px; margin-bottom:15px; opacity:0.3;"></i>
        <h2 id="v-txt" style="font-weight:400; line-height:1.6; position:relative; z-index:1;">...</h2>
        <p id="v-ref" style="color:var(--s); font-weight:bold; letter-spacing:1px;"></p>
    </div>
    
    <div class="card">
        <h3 style="color:var(--p); margin-top:0;"><i class="fas fa-book-open"></i> የሳምንቱ ትምህርት</h3>
        <p id="l-txt" style="line-height:1.8; color:var(--getem);"></p>
    </div>
</div>

<div id="songs" class="page">
    <div class="search-area">
        <div class="search-bar">
            <i class="fas fa-search" style="color:var(--s); margin-right:12px;"></i>
            <input type="text" id="search-input" placeholder="መዝሙር በስም ወይም በቁጥር ይፈልጉ..." oninput="searchSongs()">
        </div>
    </div>
    <div id="song-list"></div>
</div>

<div id="gallery" class="page">
    <h2 style="margin-left:10px; color:var(--p);">የምስጋና ማዕድ (Gallery)</h2>
    <div class="gallery-container" id="gallery-grid"></div>
</div>

<div id="live" class="page">
    <div class="card" style="background:black; padding:0; height:230px; overflow:hidden; border:none; position:relative;">
        <div id="player" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:white;">Stream Offline</div>
    </div>
    <div class="card">
        <h2>ቀጥታ ስርጭት (Live)</h2>
        <p>ለYouTube እና Telegram ስርጭቶች የተመቻቸ። በ2G ኢንተርኔት (10kb/s) እንኳን እንዳይቆራረጥ ተደርጎ የተሰራ።</p>
        <button id="tg-btn" class="card" style="width:100%; background:#24a1de; color:white; border:none; padding:15px; font-weight:bold;">
            <i class="fab fa-telegram"></i> በቴሌግራም አድምጥ (Low Data)
        </button>
    </div>
</div>

<nav>
    <i class="fas fa-home active" onclick="tab('home', this)"></i>
    <i class="fas fa-music" onclick="tab('songs', this)"></i>
    <i class="fas fa-images" onclick="tab('gallery', this)"></i>
    <i class="fas fa-play-circle" onclick="tab('live', this)"></i>
</nav>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyBN8hog89KDdG8OhP-DuikOtGTDMjRiTOA",
        databaseURL: "https://ea-youth-union-2fbe8-default-rtdb.firebaseio.com",
        projectId: "ea-youth-union-2fbe8",
        storageBucket: "ea-youth-union-2fbe8.firebasestorage.app",
        messagingSenderId: "1071585578309",
        appId: "1:1071585578309:web:ad014bede46d6889bd822c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allSongs = [];

    // --- Welcome Gate Functions ---
    function saveAndEnter() {
        const name = document.getElementById('reg-name').value.trim();
        const faith = document.getElementById('reg-faith').value;
        const city = document.getElementById('reg-city').value.trim();

        if(!name || !faith || !city) {
            alert("እባክዎ ሁሉንም መረጃዎች ይሙሉ!");
            return;
        }

        const userData = {
            name: name,
            faith: faith,
            city: city,
            joinedDate: new Date().toLocaleString('am-ET'),
            device: navigator.userAgent.includes("Android") ? "Android" : "iOS/Web"
        };

        localStorage.setItem("ea_user_verified", "true");
        localStorage.setItem("ea_user_name", name);

        if (typeof db !== 'undefined') {
            db.ref('users').push(userData)
                .then(() => finishEntry())
                .catch(() => finishEntry());
        } else {
            finishEntry();
        }
    }

    function finishEntry() {
        const gate = document.getElementById('welcome-gate');
        gate.style.opacity = "0";
        gate.style.transform = "scale(1.2)";
        setTimeout(() => {
            gate.style.display = 'none';
        }, 800);
    }
    // ------------------------------

    function sync() {
        // UI & Branding Sync
        db.ref('config').on('value', snap => {
            const d = snap.val(); if(!d) return;
            if(d.sabbath === 'on') document.body.classList.add('sab-mode');
            else document.body.classList.remove('sab-mode');
            
            document.getElementById('app-title').innerText = d.ui?.title || "EA PRO";
            document.getElementById('app-logo').src = d.ui?.logo || "";
            document.getElementById('v-txt').innerText = d.verse?.text || '';
            document.getElementById('v-ref').innerText = d.verse?.ref || '';
            document.getElementById('news-ticker').innerText = d.news?.msg || "";
            document.getElementById('l-txt').innerText = d.lesson?.body || d.lesson?.title || "";

            const p = document.getElementById('player');
            if(d.live?.status === 'on') {
                p.innerHTML = `<iframe width="100%" height="100%" src="${d.live.yt}" frameborder="0" allowfullscreen></iframe>`;
                document.getElementById('tg-btn').onclick = () => window.open(d.live.tg, '_blank');
            } else {
                p.innerHTML = "የቀጥታ ስርጭት የለም";
            }
        });

        // Songs Sync
        db.ref('songs').on('value', snap => {
            allSongs = snap.val() ? Object.values(snap.val()) : [];
            displaySongs(allSongs);
        });

        // Gallery Sync
        db.ref('gallery').on('value', snap => {
            const grid = document.getElementById('gallery-grid'); grid.innerHTML = "";
            if(snap.val()) Object.values(snap.val()).forEach(img => {
                grid.innerHTML += `<div class="gallery-card"><img src="${img.url}" loading="lazy"></div>`;
            });
        });
    }

    function searchSongs() {
        const q = document.getElementById('search-input').value.toLowerCase();
        const filtered = allSongs.filter((s, i) => s.title.toLowerCase().includes(q) || (i+1).toString() === q);
        displaySongs(filtered);
    }

    function displaySongs(songs) {
        const list = document.getElementById('song-list'); list.innerHTML = "";
        songs.forEach((s, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div onclick="toggleLyrics(this)" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
                    <b style="color:var(--p); font-size:18px;">${i+1}. ${s.title}</b>
                    <i class="fas fa-chevron-down" style="opacity:0.5;"></i>
                </div>
                <div class="lyrics-box">
                    ${s.audioUrl ? `<audio controls style="width:100%; margin-bottom:15px;" onplay="reqBackground()"><source src="${s.audioUrl}"></audio>` : ''}
                    <div class="formatted-lyrics">${formatLyrics(s.lyrics || s.data)}</div>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function formatLyrics(text) {
        if(!text) return "";
        return text.split('\n').map(line => {
            if(line.includes("አዝማች")) return `<div class="azmach-text">${line}</div>`;
            return `<div class="getem-text">${line}</div>`;
        }).join('<br>');
    }

    function toggleLyrics(el) {
        const box = el.nextElementSibling;
        const isOpen = box.style.display === 'block';
        document.querySelectorAll('.lyrics-box').forEach(b => b.style.display = 'none');
        box.style.display = isOpen ? 'none' : 'block';
    }

    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    
    function tab(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('nav i').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        window.scrollTo(0,0);
    }

    function reqBackground() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'EA Youth Songs',
                artist: 'Union in Faith',
                album: 'Spiritual Service'
            });
        }
    }

    // Background Animation
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let particles = [];
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 3;
            this.vX = Math.random() * 0.5 - 0.25;
            this.vY = Math.random() * 0.5 - 0.25;
        }
        update() {
            this.x += this.vX; this.y += this.vY;
            if(this.x > canvas.width) this.x = 0;
            if(this.y > canvas.height) this.y = 0;
        }
        draw() {
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--s');
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
        }
    }
    for(let i=0; i<60; i++) particles.push(new Particle());
    function animate() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();

    window.onload = () => {
        sync();
        if(localStorage.getItem("ea_user_verified") === "true") {
            document.getElementById('welcome-gate').style.display = 'none';
        }
    };
</script>
</body>
</html>
