<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EA Youth Union - Ultimate Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { --p: #0a4d1a; --s: #d4af37; --bg: #f8f9fa; --fSize: 18px; --aniSpd: 1.5s; }
        body { margin: 0; background: var(--bg); font-family: 'Noto Serif Ethiopic', serif; color: #333; }
        
        /* Dynamic Splash Screen */
        #loader { position: fixed; inset: 0; background: var(--p); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: 0.5s; }
        .logo-box { width: 80px; height: 80px; border: 3px solid var(--s); border-radius: 20px; animation: pulse var(--aniSpd) infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        header { background: var(--p); color: white; padding: 18px; text-align: center; border-bottom: 3px solid var(--s); position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 600px; margin: auto; padding: 15px; padding-bottom: 110px; }
        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .nav-bar { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); width: 94%; background: var(--p); border-radius: 40px; display: flex; justify-content: space-around; padding: 10px; border: 1px solid var(--s); z-index: 1000; }
        .nav-item { color: rgba(255,255,255,0.4); text-align: center; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--s); font-weight: bold; }
        .nav-item i { font-size: 18px; }
        
        .btn-action { background: var(--s); color: black; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        .admin-sec { display: none; padding-top: 15px; border-top: 2px solid #eee; margin-top: 10px; }
        #map { height: 350px; border-radius: 15px; }
        .delete-btn { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; float: right; }
    </style>
</head>
<body>

<div id="loader">
    <div class="logo-box" id="splashLogo"></div>
    <h3 style="margin-top: 20px;">EA YOUTH UNION</h3>
</div>

<header>EA YOUTH UNION</header>

<div class="container">
    <div id="home" class="page active">
        <div class="card" style="background: var(--p); color: white; text-align: center;">
            <p id="dailyVerse">"እግዚአብሔር ብርሃኔና መድኃኒቴ ነው"</p>
            <small id="verseRef" style="color:var(--s);">መዝሙር 27:1</small>
        </div>
        <div id="newsFeed"></div>
    </div>

    <div id="songs" class="page">
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <button class="btn-action" style="width:auto;" onclick="changeF(1)">A+</button>
            <button class="btn-action" style="width:auto;" onclick="changeF(-1)">A-</button>
        </div>
        <input type="text" placeholder="መዝሙር ፈልግ..." onkeyup="searchSong(this.value)">
        <div id="songList"></div>
    </div>

    <div id="map-page" class="page">
        <div id="map"></div>
        <button class="btn-action" onclick="locateUser()">አቅራቢያዬ ያሉትን ፈልግ</button>
    </div>

    <div id="thanks" class="page">
        <div id="galleryContainer"></div>
        <div id="messageFeed"></div>
    </div>

    <div id="admin" class="page">
        <div class="card">
            <h3>የአድሚን ገጽ</h3>
            <div id="stats" style="background:#eee; padding:10px; border-radius:10px; margin-bottom:10px;">ተጠቃሚዎች በመቆጠር ላይ...</div>
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <button class="btn-action" onclick="showAdm('adm-n')">ዜና</button>
                <button class="btn-action" onclick="showAdm('adm-s')">መዝሙር</button>
                <button class="btn-action" onclick="showAdm('adm-m')">መልዕክት</button>
                <button class="btn-action" onclick="showAdm('adm-v')">ጥቅስ</button>
                <button class="btn-action" onclick="showAdm('adm-set')">Settings</button>
            </div>

            <div id="adm-n" class="admin-sec"><input id="nT" placeholder="ርዕስ"><textarea id="nD" placeholder="ዜና"></textarea><button class="btn-action" onclick="saveNews()">ዜና ልቀቅ</button><div id="admNewsList"></div></div>
            <div id="adm-s" class="admin-sec"><input id="sNo" placeholder="ቁጥር"><input id="sT" placeholder="ርዕስ"><textarea id="sL" placeholder="ግጥም"></textarea><input id="sA" placeholder="Audio Link"><button class="btn-action" onclick="saveSong()">መዝሙር ጫን</button></div>
            <div id="adm-m" class="admin-sec"><textarea id="msgIn" placeholder="መልዕክት መጻፊያ..."></textarea><button class="btn-action" onclick="saveMsg()">መልዕክት ላክ</button></div>
            <div id="adm-v" class="admin-sec"><input id="vT" placeholder="ጥቅስ"><input id="vR" placeholder="ምንጭ"><button class="btn-action" onclick="saveVerse()">ጥቅስ ቀይር</button></div>
            <div id="adm-set" class="admin-sec">
                App Color: <input type="color" id="cSet"><br>
                Logo URL: <input id="lSet" placeholder="Link"><br>
                Ani Speed (s): <input type="number" id="aSet" value="1.5" step="0.1"><br>
                <button class="btn-action" onclick="saveSettings()">ለውጦችን አስቀምጥ</button>
            </div>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="showPage('home', this)"><i class="fas fa-home"></i></div>
    <div class="nav-item" onclick="showPage('songs', this)"><i class="fas fa-music"></i></div>
    <div class="nav-item" onclick="showPage('map-page', this)"><i class="fas fa-map-marker-alt"></i></div>
    <div class="nav-item" onclick="showPage('thanks', this)"><i class="fas fa-heart"></i></div>
    <div class="nav-item" onclick="adminAccess()"><i class="fas fa-user-shield"></i></div>
</nav>

<script>
    const firebaseConfig = { databaseURL: "https://ea-youth-union-app-d1358-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let map;
    window.onload = () => {
        setTimeout(() => document.getElementById('loader').style.display='none', 1500);
        loadData(); initMap();
    };

    function initMap() {
        map = L.map('map').setView([9.0192, 38.7525], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    }

    function loadData() {
        db.ref('news').on('value', s => {
            let h = "", ah = "";
            s.forEach(c => {
                h = `<div class="card"><h3>${c.val().title}</h3><p>${c.val().desc}</p></div>` + h;
                ah += `<div>${c.val().title} <button class="delete-btn" onclick="del('news','${c.key}')">X</button></div>`;
            });
            newsFeed.innerHTML = h; admNewsList.innerHTML = ah;
        });
        db.ref('songs').on('value', s => {
            let h = ""; s.forEach(c => h += `<div class="card" onclick="playS('${c.val().title}','${c.val().audio}')">${c.val().title}</div>`);
            songList.innerHTML = h;
        });
        db.ref('dailyVerse').on('value', s => { if(s.val()){ dailyVerse.innerText=s.val().t; verseRef.innerText=s.val().r; } });
        db.ref('users').on('value', s => { stats.innerText = `ጠቅላላ ተጠቃሚዎች፡ ${s.numChildren()}`; });
        db.ref('messages').on('value', s => {
            let h = ""; s.forEach(c => h = `<div class="card">${c.val().text} <button class="delete-btn" onclick="del('messages','${c.key}')">X</button></div>` + h);
            messageFeed.innerHTML = h;
        });
        db.ref('appSettings').on('value', s => {
            if(s.val()){
                document.documentElement.style.setProperty('--p', s.val().c);
                document.documentElement.style.setProperty('--aniSpd', s.val().a + 's');
                if(s.val().l) splashLogo.style.backgroundImage = `url(${s.val().l})`;
            }
        });
    }

    function playS(t, a) { if(confirm(t + " በትንሽ ዳታ ይውረድ?")) window.open(a, '_blank'); }
    function saveNews() { db.ref('news').push({title:nT.value, desc:nD.value}); }
    function saveSong() { db.ref('songs').push({no:sNo.value, title:sT.value, audio:sA.value, lyric:sL.value}); }
    function saveVerse() { db.ref('dailyVerse').set({t:vT.value, r:vR.value}); }
    function saveMsg() { db.ref('messages').push({text:msgIn.value}); }
    function saveSettings() { db.ref('appSettings').set({c:cSet.value, l:lSet.value, a:aSet.value}); alert("ተቀይሯል!"); }
    function del(p, k) { if(confirm("ይጥፋ?")) db.ref(p).child(k).remove(); }

    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
    }
    function showAdm(id) { document.querySelectorAll('.admin-sec').forEach(s => s.style.display='none'); document.getElementById(id).style.display='block'; }
    function adminAccess() { if(prompt("አድሚን ኮድ:") === "ttse9@we33") showPage('admin'); }
</script>
</body>
</html>
