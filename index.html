<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EA Youth Union - Ultimate Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root { --p: #0a4d1a; --s: #d4af37; --bg: #f8faf9; --fSize: 18px; --aniSpd: 2s; }
        body { margin: 0; background: var(--bg); font-family: 'Noto Serif Ethiopic', serif; transition: 0.3s; }
        
        /* Premium Loading Screen */
        #loader { position: fixed; inset: 0; background: var(--p); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .logo-box { width: 110px; height: 110px; background: white; border-radius: 25px; border: 4px solid var(--s); animation: pulse var(--aniSpd) infinite ease-in-out; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); box-shadow: 0 0 25px var(--s); } }

        /* Ticker */
        .ticker-wrap { background: #b00020; color: white; padding: 10px 0; overflow: hidden; white-space: nowrap; font-weight: bold; border-bottom: 2px solid var(--s); }
        .ticker { display: inline-block; animation: ticker 25s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        header { background: var(--p); color: white; padding: 18px; text-align: center; border-bottom: 4px solid var(--s); position: sticky; top: 0; z-index: 1000; font-weight: bold; }
        .container { max-width: 600px; margin: auto; padding: 12px; padding-bottom: 120px; }
        .page { display: none; }
        .page.active { display: block; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: white; border-radius: 20px; padding: 18px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        .nav-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; background: var(--p); border-radius: 40px; display: flex; justify-content: space-around; padding: 12px; border: 1px solid var(--s); z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .nav-item { color: rgba(255,255,255,0.4); text-align: center; flex: 1; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--s); }
        .nav-item i { font-size: 20px; }
        .nav-item span { display: block; font-size: 10px; margin-top: 4px; }

        .btn-action { background: var(--s); color: black; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        input, textarea { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-family: inherit; }
        
        #vLy { white-space: pre-line; line-height: 2; font-size: var(--fSize); touch-action: none; transition: 0.1s; }
        #map { height: 350px; width: 100%; border-radius: 20px; }
        .admin-sec { display: none; background: #fff; padding: 15px; border-radius: 15px; border: 2px dashed var(--s); margin-top: 10px; }
    </style>
</head>
<body>

<div id="loader">
    <div class="logo-box"><img id="appLogo" src=""></div>
    <h3 style="margin-top:20px;">EA YOUTH UNION</h3>
</div>

<div class="ticker-wrap"><div class="ticker" id="tickerMsg">...</div></div>
<header id="appHeader">EA YOUTH UNION</header>

<div class="container">
    <div id="home" class="page active">
        <div class="card" style="background: linear-gradient(135deg, var(--p), #052a0d); color: white; text-align: center;">
            <h3 id="dVerse">...</h3>
            <small id="vRef" style="color:var(--s);"></small>
        </div>
        <div id="newsFeed"></div>
    </div>

    <div id="songs" class="page">
        <input type="text" id="sSearch" placeholder="መዝሙር ፈልግ..." onkeyup="filterSongs(this.value)">
        <div id="songList" style="margin-top:10px;"></div>
    </div>

    <div id="calendar" class="page">
        <div class="card" style="background:var(--p); color:white; text-align:center;">
            <h2 id="ethDay"></h2><h4 id="ethDate"></h4>
        </div>
        <div class="card">
            <input type="text" id="aptT" placeholder="ቀጠሮ ርዕስ"><input type="datetime-local" id="aptD">
            <button class="btn-action" onclick="saveAptLocal()">መዝግብ</button>
            <div id="aptList" style="margin-top:10px;"></div>
        </div>
    </div>

    <div id="map-page" class="page">
        <div class="card">
            <div id="map"></div>
            <button class="btn-action" onclick="askMapPermission()">ካርታውን ክፈት</button>
            <p id="permMsg" style="font-size: 12px; color: red; text-align: center; display: none;">እባክዎን የቦታ መረጃ (GPS) ፍቃድ ይስጡ።</p>
        </div>
    </div>

    <div id="thanks" class="page">
        <div id="tGallery" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;"></div>
        <div class="card"><p id="tText" style="text-align:center;"></p></div>
        <div style="text-align: center; margin-top: 50px;"><span onclick="adminCheck()" style="opacity: 0.05;">⚫</span></div>
    </div>

    <div id="viewer" class="page">
        <div class="card">
            <h2 id="viewTi" style="text-align:center; color:var(--p);"></h2>
            <div id="audArea" style="display:none; margin-bottom: 15px;"><audio id="player" controls style="width:100%;"></audio></div>
            <div id="vLy"></div>
            <button class="btn-action" onclick="stopPlayer(); showPage('songs')">ተመለስ</button>
        </div>
    </div>

    <div id="admin" class="page">
        <div class="card" style="background:#111; color:white;"><h3>Admin Panel <span id="admSt" style="float:right; font-size:12px; color:var(--s);"></span></h3></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <button class="btn-action" onclick="showAdm('a-ui')">UI/Logo</button>
            <button class="btn-action" onclick="showAdm('a-news')">ዜና/ጥቅስ</button>
            <button class="btn-action" onclick="showAdm('a-song')">Song Edit</button>
            <button class="btn-action" onclick="showAdm('a-stat')">Stats</button>
        </div>
        <div id="a-ui" class="admin-sec">
            <input id="inL" placeholder="Logo URL"><input id="inA" type="number" step="0.1" placeholder="Ani Speed">
            <button class="btn-action" onclick="db.ref('settings').update({logo:inL.value, ani:inA.value})">Update</button>
        </div>
        <div id="a-news" class="admin-sec">
            <input id="inTk" placeholder="Ticker Message"><input id="inVT" placeholder="Verse"><input id="inVR" placeholder="Ref">
            <button class="btn-action" onclick="db.ref('ticker').set(inTk.value); db.ref('verse').set({t:inVT.value, r:inVR.value})">Save</button>
        </div>
        <div id="a-song" class="admin-sec">
            <input id="sN" type="number" placeholder="No"><input id="sTi" placeholder="Title"><textarea id="sLyric" placeholder="Lyric"></textarea><input id="sAu" placeholder="Audio URL">
            <button class="btn-action" onclick="db.ref('songs/'+sN.value).set({no:sN.value, ti:sTi.value, ly:sLyric.value, aud:sAu.value})">Save</button>
        </div>
        <div id="a-stat" class="admin-sec">
            <input id="rN" placeholder="Relig"><input id="rC" type="number"><input id="cN" placeholder="City"><input id="cC" type="number">
            <button class="btn-action" onclick="db.ref('stats').set({rN:rN.value, rC:rC.value, cN:cN.value, cC:cC.value})">Update</button>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="showPage('home', this)"><i class="fas fa-home"></i><span>ቤት</span></div>
    <div class="nav-item" onclick="showPage('songs', this)"><i class="fas fa-music"></i><span>መዝሙር</span></div>
    <div class="nav-item" onclick="showPage('calendar', this)"><i class="fas fa-calendar-alt"></i><span>ቀን</span></div>
    <div class="nav-item" onclick="showPage('map-page', this)"><i class="fas fa-map-marked-alt"></i><span>ካርታ</span></div>
    <div class="nav-item" onclick="showPage('thanks', this)"><i class="fas fa-heart"></i><span>ምስጋና</span></div>
</nav>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const firebaseConfig = { databaseURL: "https://ea-youth-union-app-d1358-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }

    window.onload = () => {
        setTimeout(() => document.getElementById('loader').style.display='none', 2000);
        updateDate(); 
        
        // 1. መጀመሪያ ስልክህ ላይ ያለውን የቀድሞ መረጃ አሳይ
        const saved = localStorage.getItem('master_cache');
        if(saved) { renderUI(JSON.parse(saved)); }

        // 2. ኢንተርኔት ካለ አዲስ ነገር በ Background አምጣና አድስ
        db.ref('/').on('value', s => {
            const data = s.val();
            if(data) {
                localStorage.setItem('master_cache', JSON.stringify(data)); // ለሚቀጥለው ጊዜ ሴቭ ሆነ
                renderUI(data); // አፑን በአዲስ ዳታ አደሰው
            }
        });

        setupZoom();
        loadAppointments();
    };

    function renderUI(data) {
        if(data.settings) {
            appLogo.src = data.settings.logo || "";
            document.documentElement.style.setProperty('--aniSpd', (data.settings.ani || 2) + 's');
        }
        if(data.ticker) tickerMsg.innerText = data.ticker;
        if(data.verse) { dVerse.innerText = data.verse.t; vRef.innerText = data.verse.r; }
        if(data.songs) {
            let h = "";
            Object.values(data.songs).forEach(s => {
                h += `<div class="card" onclick="openSong('${s.ti}',\`${s.ly}\`,'${s.aud || ""}')"><b>${s.no}. ${s.ti}</b></div>`;
            });
            songList.innerHTML = h;
        }
        if(data.stats) admSt.innerText = `${data.stats.rN}:${data.stats.rC} | ${data.stats.cN}:${data.stats.cC}`;
        if(data.thanks) {
            tText.innerText = data.thanks.txt;
            tGallery.innerHTML = data.thanks.imgs.split(',').map(i => `<img src="${i.trim()}" style="width:100%; border-radius:12px; height:100px; object-fit:cover;">`).join('');
        }
    }

    function askMapPermission() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                permMsg.style.display = 'none';
                initMap(pos.coords.latitude, pos.coords.longitude);
            }, err => {
                permMsg.style.display = 'block';
                alert("ካርታውን ለመጠቀም እባክዎን Permission ይስጡ።");
            });
        }
    }

    function initMap(lat, lon) {
        let m = L.map('map').setView([lat, lon], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
        L.marker([lat, lon]).addTo(m).bindPopup("አንተ እዚህ ነህ").openPopup();
        
        // SDA Churches Search (SDA አብያተ ክርስቲያናት)
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=Seventh+Day+Adventist+Church&lat=${lat}&lon=${lon}&limit=10`)
        .then(r => r.json()).then(d => d.forEach(pl => L.marker([pl.lat, pl.lon]).addTo(m).bindPopup(pl.display_name)));
    }

    function updateDate() {
        const now = new Date(); const days = ['እሁድ', 'ሰኞ', 'ማክሰኞ', 'ረቡዕ', 'ሐሙስ', 'አርብ', 'ቅዳሜ'];
        ethDay.innerText = days[now.getDay()]; ethDate.innerText = now.toLocaleDateString('am-ET');
        if(now.getDay() === 6) document.documentElement.style.setProperty('--p', '#d4af37');
    }

    function openSong(t, l, a) {
        viewTi.innerText = t; vLy.innerText = l;
        if(a) { audArea.style.display='block'; player.src=a; } else { audArea.style.display='none'; }
        showPage('viewer');
    }

    function stopPlayer() { player.pause(); player.src=""; }
    function filterSongs(v) { document.querySelectorAll('#songList .card').forEach(c => c.style.display = c.innerText.toLowerCase().includes(v.toLowerCase()) ? "block" : "none"); }

    function setupZoom() {
        let scale = 18; let initialD = 0;
        vLy.addEventListener('touchstart', e => { if(e.touches.length === 2) initialD = Math.hypot(e.touches[0].pageX - e.touches[1].pageX); });
        vLy.addEventListener('touchmove', e => {
            if(e.touches.length === 2) {
                let d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX);
                scale = d > initialD ? Math.min(scale + 0.5, 45) : Math.max(scale - 0.5, 12);
                document.documentElement.style.setProperty('--fSize', scale + 'px');
            }
        });
    }

    function saveAptLocal() {
        let apts = JSON.parse(localStorage.getItem('my_apts') || "[]");
        apts.push({t:aptT.value, d:aptD.value});
        localStorage.setItem('my_apts', JSON.stringify(apts));
        loadAppointments();
    }

    function loadAppointments() {
        let apts = JSON.parse(localStorage.getItem('my_apts') || "[]");
        aptList.innerHTML = apts.map(a => `<div class="card" style="font-size:12px;"><b>${a.t}</b> - ${a.d}</div>`).join('');
    }

    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
    }
    function showAdm(id) { document.querySelectorAll('.admin-sec').forEach(s => s.style.display='none'); document.getElementById(id).style.display='block'; }
    let cl = 0; function adminCheck() { cl++; if(cl === 3) { if(prompt("Code:") === "ttse9@we33") showPage('admin'); cl = 0; } }
</script>
</body>
</html>
