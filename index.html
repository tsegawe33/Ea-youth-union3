<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EA Youth Union - Elite Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { 
            --p: #0a4d1a; 
            --s: #d4af37; 
            --bg: #f8faf9; 
            --fSize: 18px; 
            --aniDuration: 2s;
        }
        body { margin: 0; background: var(--bg); font-family: 'Noto Serif Ethiopic', serif; color: #333; transition: 0.3s; }
        
        /* Premium Ticker */
        .ticker-wrap { background: linear-gradient(90deg, #ff4b2b, #ff416c); color: white; padding: 8px 0; overflow: hidden; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .ticker { display: inline-block; animation: ticker 25s linear infinite; padding-left: 100%; }
        @keyframes ticker { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* Animated Logo System */
        .logo-box { text-align: center; padding: 20px; }
        #appLogo { 
            width: 100px; height: 100px; border-radius: 20%; 
            border: 4px solid var(--s); box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: customAni var(--aniDuration) infinite ease-in-out;
        }
        @keyframes customAni { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.1) rotate(5deg); } }

        header { background: var(--p); color: white; padding: 18px; text-align: center; border-bottom: 4px solid var(--s); font-size: 20px; font-weight: 700; position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 600px; margin: auto; padding: 15px; padding-bottom: 120px; }
        .page { display: none; }
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 18px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.03); }
        
        /* Navigation */
        .nav-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; background: var(--p); border-radius: 40px; display: flex; justify-content: space-around; padding: 12px; border: 1px solid var(--s); z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .nav-item { color: rgba(255,255,255,0.4); text-align: center; flex:1; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--s); transform: translateY(-5px); }
        .nav-item i { font-size: 20px; }
        .nav-item span { display: block; font-size: 10px; margin-top: 4px; font-weight: bold; }

        .btn-action { background: var(--s); color: #000; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: 900; cursor: pointer; margin-top: 10px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-action:active { transform: scale(0.95); }
        
        input, textarea, select { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #ddd; font-family: inherit; font-size: 15px; }
        .admin-sec { display: none; background: #fdfdfd; padding: 15px; border-radius: 15px; border: 2px dashed var(--p); margin-top: 10px; }
        
        #map { height: 350px; width: 100%; border-radius: 20px; border: 2px solid var(--s); }
        #vLy { white-space: pre-line; line-height: 2; transition: 0.2s; touch-action: none; font-weight: 500; }
    </style>
</head>
<body>

<div class="ticker-wrap"><div class="ticker" id="urgentNews">Loading important updates...</div></div>

<header id="appHeader">EA YOUTH UNION</header>

<div class="container">
    <div id="home" class="page active">
        <div class="logo-box"><img id="appLogo" src="https://via.placeholder.com/100" alt="Logo"></div>
        <div class="card" style="background: linear-gradient(135deg, var(--p), #063111); color: white; text-align: center; border:none;">
            <h3 id="dailyVerse">...</h3>
            <small id="verseRef" style="color:var(--s); font-weight:bold;"></small>
        </div>
        <div id="newsFeed"></div>
    </div>

    <div id="songs" class="page">
        <div class="card">
            <input type="text" id="sSearch" placeholder="🔍 መዝሙር በቁጥር ወይም በTitle ፈልግ..." onkeyup="searchSong(this.value)">
            <button class="btn-action" style="background:#222; color:white;" onclick="downloadAllAudio()">
                <i class="fas fa-cloud-download-alt"></i> ሁሉንም መዝሙሮች ለኦፍላይን አውርድ
            </button>
        </div>
        <div id="songList"></div>
    </div>

    <div id="calendar" class="page">
        <div class="card" style="text-align:center; background:var(--p); color:white;">
            <h1 id="ethDay" style="margin:0;"></h1>
            <p id="fullDate" style="opacity:0.8;"></p>
        </div>
        <div class="card">
            <h4><i class="fas fa-bell"></i> የሰንበት መግቢያ ማስታወሻ</h4>
            <input type="time" id="alarmTime">
            <button class="btn-action">ደወል መዝግብ</button>
        </div>
    </div>

    <div id="map-page" class="page">
        <div class="card">
            <div id="map"></div>
            <button class="btn-action" onclick="findSDA()"><i class="fas fa-location-arrow"></i> አቅራቢያዬ ያሉትን ፈልግ</button>
        </div>
    </div>

    <div id="thanks" class="page">
        <div class="card" style="border-top: 5px solid var(--s); text-align:center;">
            <h2 style="color:var(--p);">የምስጋና መርሃ-ግብር</h2>
            <div id="photoGallery" class="gallery" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:15px 0;"></div>
            <p id="thanksText" style="line-height:1.8; color:#555;"></p>
        </div>
        <div style="text-align: center; margin-top: 40px;">
            <span onclick="adminClick()" style="opacity: 0.02; cursor: pointer;">⚫</span>
        </div>
    </div>

    <div id="admin" class="page">
        <div class="card" style="background:#1a1a1a; color:white;">
            <h3><i class="fas fa-user-shield"></i> Admin Panel</h3>
            <div id="admStats" style="font-size:14px; color:var(--s); padding:10px; background:rgba(255,255,255,0.1); border-radius:10px;"></div>
        </div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <button class="btn-action" onclick="showAdm('adm-ui')">UI/Logo Edit</button>
            <button class="btn-action" onclick="showAdm('adm-song')">Song Edit</button>
            <button class="btn-action" onclick="showAdm('adm-news')">News Edit</button>
            <button class="btn-action" onclick="showAdm('adm-thanks')">Thanks Edit</button>
        </div>

        <div id="adm-ui" class="admin-sec">
            <h4>የአፑ መልክ (UI)</h4>
            <input id="logoUrl" placeholder="Logo Image URL">
            <input id="primaryColor" type="color" title="Main Color">
            <p>አኒሜሽን ፍጥነት (ሰከንድ)፦</p>
            <input id="aniSpeed" type="range" min="0.5" max="5" step="0.5" value="2">
            <button class="btn-action" onclick="saveUI()">አዘምን</button>
        </div>

        <div id="adm-song" class="admin-sec">
            <input id="sN" type="number" placeholder="ቁጥር"><input id="sT" placeholder="ርዕስ"><textarea id="sL" placeholder="ግጥም"></textarea><input id="sA" placeholder="Audio URL">
            <button class="btn-action" onclick="saveSong()">ሴቭ / አዘምን</button>
            <button class="btn-action" style="background:#ff4b2b; color:white;" onclick="delSong()">ድለታ (Delete)</button>
        </div>

        <div id="adm-news" class="admin-sec">
            <input id="uText" placeholder="የሚንቀሳቀስ ማስታወቂያ (Ticker)">
            <input id="vText" placeholder="የእለቱ ጥቅስ">
            <button class="btn-action" onclick="saveNews()">አዘምን</button>
        </div>

        <div id="adm-thanks" class="admin-sec">
            <textarea id="tText" placeholder="የምስጋና ጽሁፍ"></textarea>
            <input id="tImgs" placeholder="የምስል ሊንኮች (በኮማ ይለዩ)">
            <button class="btn-action" onclick="saveThanks()">አዘምን</button>
        </div>
    </div>

    <div id="viewer" class="page">
        <div class="card" style="min-height: 80vh;">
            <h2 id="vTi" style="text-align:center; color:var(--p);"></h2>
            <audio id="mainAudio" controls style="width:100%; margin:15px 0; border-radius:30px;"></audio>
            <div id="vLy"></div>
            <button class="btn-action" onclick="showPage('songs')" style="margin-top:30px;">ተመለስ</button>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="showPage('home', this)"><i class="fas fa-home"></i><span>ቤት</span></div>
    <div class="nav-item" onclick="showPage('songs', this)"><i class="fas fa-music"></i><span>መዝሙር</span></div>
    <div class="nav-item" onclick="showPage('calendar', this)"><i class="fas fa-calendar-alt"></i><span>ቀን</span></div>
    <div class="nav-item" onclick="showPage('map-page', this)"><i class="fas fa-map-marker-alt"></i><span>ካርታ</span></div>
    <div class="nav-item" onclick="showPage('thanks', this)"><i class="fas fa-heart"></i><span>ምስጋና</span></div>
</nav>

<script>
    const firebaseConfig = { databaseURL: "https://ea-youth-union-app-d1358-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    window.onload = () => {
        const d = new Date();
        const days = ['እሁድ', 'ሰኞ', 'ማክሰኞ', 'ረቡዕ', 'ሐሙስ', 'አርብ', 'ቅዳሜ'];
        ethDay.innerText = days[d.getDay()];
        fullDate.innerText = d.toLocaleDateString('en-GB');
        if(d.getDay() === 6) document.documentElement.style.setProperty('--p', '#d4af37');
        
        loadData();
        setupPinch();
    };

    function loadData() {
        db.ref('appSettings').on('value', s => {
            if(s.val()){
                document.documentElement.style.setProperty('--p', s.val().color || '#0a4d1a');
                document.documentElement.style.setProperty('--aniDuration', (s.val().aniSpeed || 2) + 's');
                appLogo.src = s.val().logo || 'https://via.placeholder.com/100';
            }
        });
        db.ref('urgent').on('value', s => urgentNews.innerText = s.val() || "EA Youth Union Welcome!");
        db.ref('dailyVerse').on('value', s => dailyVerse.innerText = s.val() || "ጌታ ብርሃኔና መድኃኒቴ ነው፤ የሚያስፈራኝ ማን ነው?");
        db.ref('songs').orderByChild('no').on('value', s => {
            let h = ""; s.forEach(c => {
                const d = c.val();
                h += `<div class="card" onclick="openSong('${d.title}',\`${d.lyric}\`,'${d.audio}',${d.no})"><b>${d.no}. ${d.title}</b> <i class="fas fa-chevron-right" style="float:right; opacity:0.3;"></i></div>`;
            });
            songList.innerHTML = h;
        });
        db.ref('thanksData').on('value', s => {
            if(s.val()){
                thanksText.innerText = s.val().text;
                photoGallery.innerHTML = s.val().images.split(',').map(img => `<img src="${img.trim()}" style="width:100%; border-radius:12px; height:120px; object-fit:cover;">`).join('');
            }
        });
    }

    function setupPinch() {
        let el = document.getElementById('vLy');
        let scale = 18;
        el.addEventListener('touchstart', e => { if(e.touches.length === 2) initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); });
        el.addEventListener('touchmove', e => {
            if(e.touches.length === 2) {
                let dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                scale = dist > initialDist ? Math.min(scale + 0.8, 50) : Math.max(scale - 0.8, 12);
                el.style.fontSize = scale + 'px';
            }
        });
    }

    function openSong(t, l, a, n) {
        vTi.innerText = t; vLy.innerText = l;
        mainAudio.src = a || "";
        showPage('viewer');
    }

    // Admin Functions
    function saveUI() {
        db.ref('appSettings').update({ logo: logoUrl.value, color: primaryColor.value, aniSpeed: aniSpeed.value });
        alert("Settings Updated!");
    }
    function saveSong() {
        db.ref('songs/' + sN.value).set({ no: sN.value, title: sT.value, lyric: sL.value, audio: sA.value });
        alert("Song Saved!");
    }
    function delSong() { if(confirm("Delete this song?")) db.ref('songs/' + sN.value).remove(); }
    function saveNews() {
        if(uText.value) db.ref('urgent').set(uText.value);
        if(vText.value) db.ref('dailyVerse').set(vText.value);
        alert("News Updated!");
    }
    function saveThanks() {
        db.ref('thanksData').set({ text: tText.value, images: tImgs.value });
        alert("Thanks Content Updated!");
    }

    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
    }
    function showAdm(id) { document.querySelectorAll('.admin-sec').forEach(s => s.style.display='none'); document.getElementById(id).style.display='block'; }
    let cl = 0; function adminClick() { cl++; if(cl === 3) { if(prompt("Security Code:") === "ttse9@we33") showPage('admin'); cl = 0; } }
    
    function searchSong(val) {
        let cards = songList.getElementsByClassName('card');
        for (let i = 0; i < cards.length; i++) {
            cards[i].style.display = cards[i].innerText.toLowerCase().includes(val.toLowerCase()) ? "block" : "none";
        }
    }
</script>
</body>
</html>
