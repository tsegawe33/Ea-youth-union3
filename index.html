<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EA Youth Union - Ultimate Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { --p: #0a4d1a; --s: #d4af37; --bg: #f4f7f6; --fSize: 18px; --aniSpd: 2s; }
        body { margin: 0; background: var(--bg); font-family: 'Noto Serif Ethiopic', serif; color: #333; transition: 0.3s; }
        
        /* Premium Loader & Logo Animation */
        #loader { position: fixed; inset: 0; background: var(--p); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: 0.5s; }
        .logo-box { width: 110px; height: 110px; background: white; border-radius: 25px; border: 4px solid var(--s); animation: pulse var(--aniSpd) infinite ease-in-out; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 20px var(--s); } 100% { transform: scale(1); } }

        /* Urgent Ticker News */
        .ticker-wrap { background: #b00020; color: white; padding: 8px 0; overflow: hidden; white-space: nowrap; font-weight: bold; font-size: 14px; border-bottom: 2px solid var(--s); }
        .ticker { display: inline-block; animation: ticker 25s linear infinite; padding-left: 100%; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        header { background: var(--p); color: white; padding: 18px; text-align: center; border-bottom: 4px solid var(--s); position: sticky; top: 0; z-index: 1000; font-weight: bold; }
        .container { max-width: 600px; margin: auto; padding: 12px; padding-bottom: 120px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: white; border-radius: 20px; padding: 18px; margin-bottom: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.03); }
        .nav-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; background: var(--p); border-radius: 40px; display: flex; justify-content: space-around; padding: 12px; border: 1px solid var(--s); z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .nav-item { color: rgba(255,255,255,0.4); text-align: center; cursor: pointer; flex: 1; transition: 0.3s; }
        .nav-item.active { color: var(--s); transform: translateY(-5px); }
        .nav-item i { font-size: 20px; }
        .nav-item span { display: block; font-size: 10px; margin-top: 3px; font-weight: bold; }

        .btn-action { background: var(--s); color: black; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-action:active { transform: scale(0.96); }
        
        input, textarea { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #ddd; background: #fff; font-family: inherit; font-size: 15px; box-sizing: border-box; }
        .admin-sec { display: none; background: #fff; padding: 15px; border-radius: 15px; border: 2px dashed var(--s); margin-top: 10px; }
        
        #vLy { white-space: pre-line; line-height: 2; font-size: var(--fSize); touch-action: none; transition: 0.1s; }
        #map { height: 350px; width: 100%; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .gallery img { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; border: 2px solid var(--s); }
    </style>
</head>
<body id="mainBody">

<div id="loader">
    <div class="logo-box"><img id="appLogo" src=""></div>
    <h3 style="margin-top:20px; letter-spacing: 1px;">EA YOUTH UNION</h3>
</div>

<div class="ticker-wrap"><div class="ticker" id="tickerMsg">የተመረጡ ጥቅሶች እና አስቸኳይ ማስታወቂያዎች እዚህ ይተላለፋሉ...</div></div>
<header id="appHeader">EA YOUTH UNION</header>

<div class="container">
    <div id="home" class="page active">
        <div class="card" style="background: linear-gradient(135deg, var(--p), #052a0e); color: white; text-align: center;">
            <h3 id="dVerse">...</h3>
            <small id="vRef" style="color:var(--s); font-weight: bold;"></small>
        </div>
        <div id="newsFeed"></div>
    </div>

    <div id="songs" class="page">
        <input type="text" id="sSearch" placeholder="መዝሙር በስም ወይም በቁጥር ፈልግ..." onkeyup="filterSongs(this.value)">
        <div id="songList" style="margin-top:15px;"></div>
    </div>

    <div id="calendar" class="page">
        <div class="card" style="background:var(--p); color:white; text-align:center;">
            <h2 id="ethDayName"></h2>
            <h4 id="ethFullDate"></h4>
        </div>
        <div class="card">
            <h4>የቀን ቀጠሮ መያዣ</h4>
            <input type="text" id="aptTitle" placeholder="የቀጠሮው ርዕስ">
            <input type="datetime-local" id="aptTime">
            <button class="btn-action" onclick="saveApt()">ቀጠሮ መዝግብ</button>
            <div id="aptList" style="margin-top:15px;"></div>
        </div>
    </div>

    <div id="map-page" class="page">
        <div class="card">
            <div id="map"></div>
            <button class="btn-action" onclick="loadMap()">አቅራቢያ ያሉ አድቬንቲስት አብያተ ክርስቲያናት</button>
        </div>
    </div>

    <div id="thanks" class="page">
        <div class="gallery" id="thanksGallery"></div>
        <div class="card"><p id="thanksText" style="line-height:1.8; text-align:center;"></p></div>
        <div style="text-align: center; margin-top: 40px;"><span onclick="adminCheck()" style="opacity: 0.02; cursor: pointer;">⚫</span></div>
    </div>

    <div id="viewer" class="page">
        <div class="card">
            <h2 id="viewTitle" style="text-align:center; color:var(--p);"></h2>
            <div id="audioArea" style="margin-bottom:15px; display:none;">
                <audio id="player" controls style="width:100%;"></audio>
            </div>
            <div id="vLy"></div>
            <button class="btn-action" onclick="stopPlayer(); showPage('songs')">ተመለስ</button>
        </div>
    </div>

    <div id="admin" class="page">
        <div class="card" style="background:#111; color:white;">
            <h3>Admin Master <span id="adminStats" style="float:right; color:var(--s); font-size:11px;"></span></h3>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <button class="btn-action" onclick="showAdm('adm-ui')">Logo/Ani</button>
            <button class="btn-action" onclick="showAdm('adm-news')">ዜና/Ticker</button>
            <button class="btn-action" onclick="showAdm('adm-song')">መዝሙር Edit</button>
            <button class="btn-action" onclick="showAdm('adm-stat')">Stat Edit</button>
            <button class="btn-action" onclick="showAdm('adm-thanks')">Thanks Edit</button>
        </div>

        <div id="adm-ui" class="admin-sec">
            <input id="inLogo" placeholder="Logo URL"><input id="inAni" type="number" step="0.5" placeholder="Ani Speed (Sec)">
            <button class="btn-action" onclick="saveUI()">Update UI</button>
        </div>
        <div id="adm-news" class="admin-sec">
            <input id="inTick" placeholder="Ticker Message"><input id="inVT" placeholder="Daily Verse"><input id="inVR" placeholder="Ref">
            <button class="btn-action" onclick="saveNews()">Save</button>
        </div>
        <div id="adm-song" class="admin-sec">
            <input id="sNo" type="number" placeholder="No (ቁጥር)"><input id="sTi" placeholder="Title"><textarea id="sLy" rows="5" placeholder="Lyric"></textarea><input id="sAu" placeholder="Audio Link">
            <button class="btn-action" onclick="saveSong()">Save/Update</button>
            <button class="btn-action" style="background:red; color:white;" onclick="delSong()">Delete</button>
        </div>
        <div id="adm-stat" class="admin-sec">
            <input id="rN" placeholder="ሃይማኖት"><input id="rC" type="number" placeholder="ብዛት">
            <input id="cN" placeholder="ከተማ"><input id="cC" type="number" placeholder="ብዛት">
            <button class="btn-action" onclick="saveStat()">Update Statistics</button>
        </div>
        <div id="adm-thanks" class="admin-sec">
            <textarea id="thTxt" placeholder="ምስጋና ጽሁፍ"></textarea><input id="thImg" placeholder="Image URLs (comma separated)">
            <button class="btn-action" onclick="saveThanks()">Update Thanks</button>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="showPage('home', this)"><i class="fas fa-home"></i><span>ቤት</span></div>
    <div class="nav-item" onclick="showPage('songs', this)"><i class="fas fa-music"></i><span>መዝሙር</span></div>
    <div class="nav-item" onclick="showPage('calendar', this)"><i class="fas fa-calendar-alt"></i><span>ቀን</span></div>
    <div class="nav-item" onclick="showPage('map-page', this)"><i class="fas fa-map-marker-alt"></i><span>ካርታ</span></div>
    <div class="nav-item" onclick="showPage('thanks', this)"><i class="fas fa-heart"></i><span>ምስጋና</span></div>
</nav>

<script>
    const firebaseConfig = { databaseURL: "https://ea-youth-union-app-d1358-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 100% Offline Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
    }

    window.onload = () => {
        setTimeout(() => document.getElementById('loader').style.display='none', 2000);
        updateDateTime(); loadData(); setupZoom();
    };

    function updateDateTime() {
        const now = new Date();
        const days = ['እሁድ', 'ሰኞ', 'ማክሰኞ', 'ረቡዕ', 'ሐሙስ', 'አርብ', 'ቅዳሜ'];
        ethDayName.innerText = days[now.getDay()];
        ethFullDate.innerText = now.toLocaleDateString('am-ET', { year:'numeric', month:'long', day:'numeric' });
        if(now.getDay() === 6) { // Sabbath Mode
            document.documentElement.style.setProperty('--p', '#d4af37');
            document.body.style.backgroundColor = "#fffdf0";
        }
    }

    function loadData() {
        db.ref('settings').on('value', s => {
            if(s.val()){
                appLogo.src = s.val().logo;
                document.documentElement.style.setProperty('--aniSpd', (s.val().ani || 2) + 's');
            }
        });
        db.ref('ticker').on('value', s => tickerMsg.innerText = s.val() || "EA Youth Union");
        db.ref('verse').on('value', s => { if(s.val()){ dVerse.innerText = s.val().t; vRef.innerText = s.val().r; }});
        db.ref('songs').on('value', s => {
            let h = "";
            s.forEach(c => {
                const data = c.val();
                h += `<div class="card" onclick="openSong('${data.ti}',\`${data.ly}\`,'${data.aud || ""}')">
                    <b>${data.no}. ${data.ti}</b>
                    <i class="fas ${data.aud ? 'fa-play-circle' : 'fa-align-left'}" style="float:right; color:var(--p);"></i>
                </div>`;
            });
            songList.innerHTML = h;
        });
        db.ref('stats').on('value', s => { if(s.val()) adminStats.innerText = `${s.val().rN}:${s.val().rC} | ${s.val().cN}:${s.val().cC}`; });
        db.ref('thanks').on('value', s => {
            if(s.val()){
                thanksText.innerText = s.val().txt;
                thanksGallery.innerHTML = s.val().imgs.split(',').map(i => `<img src="${i.trim()}">`).join('');
            }
        });
    }

    function openSong(t, l, a) {
        viewTitle.innerText = t; vLy.innerText = l;
        if(a) { audioArea.style.display='block'; player.src=a; } else { audioArea.style.display='none'; }
        showPage('viewer');
    }

    function stopPlayer() { player.pause(); player.src=""; }

    function filterSongs(v) {
        document.querySelectorAll('#songList .card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(v.toLowerCase()) ? "block" : "none";
        });
    }

    function setupZoom() {
        let scale = 18; let initialD = 0;
        vLy.addEventListener('touchstart', e => { if(e.touches.length === 2) initialD = Math.hypot(e.touches[0].pageX - e.touches[1].pageX); });
        vLy.addEventListener('touchmove', e => {
            if(e.touches.length === 2) {
                let d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX);
                scale = d > initialD ? Math.min(scale + 0.5, 45) : Math.max(scale - 0.5, 12);
                document.documentElement.style.setProperty('--fSize', scale + 'px');
            }
        });
    }

    function loadMap() {
        let m = L.map('map').setView([9.0192, 38.7525], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                const lat = p.coords.latitude, lon = p.coords.longitude;
                m.setView([lat, lon], 14);
                L.marker([lat, lon]).addTo(m).bindPopup("አንተ እዚህ ነህ").openPopup();
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=Seventh+Day+Adventist+Church&lat=${lat}&lon=${lon}&limit=15`)
                .then(r => r.json()).then(d => d.forEach(pl => L.marker([pl.lat, pl.lon]).addTo(m).bindPopup(pl.display_name)));
            });
        }
    }

    // Admin Functions
    function saveUI() { db.ref('settings').update({logo:inLogo.value, ani:inAni.value}); alert("Updated!"); }
    function saveNews() { db.ref('ticker').set(inTick.value); db.ref('verse').set({t:inVT.value, r:inVR.value}); alert("Saved!"); }
    function saveSong() { db.ref('songs/'+sNo.value).set({no:sNo.value, ti:sTi.value, ly:sLy.value, aud:sAu.value}); alert("Saved!"); }
    function delSong() { if(confirm("Delete?")) db.ref('songs/'+sNo.value).remove(); }
    function saveStat() { db.ref('stats').set({rN:rN.value, rC:rC.value, cN:cN.value, cC:cC.value}); alert("Stats Saved!"); }
    function saveThanks() { db.ref('thanks').set({txt:thTxt.value, imgs:thImg.value}); alert("Updated!"); }

    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
    }
    function showAdm(id) { document.querySelectorAll('.admin-sec').forEach(s => s.style.display='none'); document.getElementById(id).style.display='block'; }
    let cl = 0; function adminCheck() { cl++; if(cl === 3) { if(prompt("Code:") === "ttse9@we33") showPage('admin'); cl = 0; } }
</script>
</body>
</html>
