<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EA Youth Union - Secure Admin Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { --p: #0a4d1a; --s: #d4af37; --bg: #f4f7f6; --fSize: 18px; }
        body { margin: 0; background: var(--bg); font-family: 'Noto Serif Ethiopic', serif; -webkit-user-select: none; }
        
        /* Loading Screen */
        #loader { position: fixed; inset: 0; background: var(--p); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: 0.5s; }
        .logo-ani { width: 85px; height: 85px; background: white; border-radius: 20px; border: 3px solid var(--s); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        header { background: var(--p); color: white; padding: 18px; text-align: center; border-bottom: 3px solid var(--s); font-weight: bold; position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 600px; margin: auto; padding: 15px; padding-bottom: 110px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; border-radius: 15px; padding: 18px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .nav-bar { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); width: 94%; background: var(--p); border-radius: 35px; display: flex; justify-content: space-around; padding: 10px; border: 1px solid var(--s); z-index: 2000; }
        .nav-item { color: rgba(255,255,255,0.3); text-align: center; flex:1; cursor: pointer; }
        .nav-item.active { color: var(--s); }
        .nav-item span { display: block; font-size: 10px; }

        .btn-action { background: var(--s); color: black; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .admin-sec { display: none; background: #fff; padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid #ddd; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        #map { height: 350px; width: 100%; border-radius: 15px; background: #eee; }
        
        .stat-grid-admin { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #111; color: var(--s); padding: 15px; border-radius: 10px; text-align: center; font-size: 14px; border: 1px solid var(--s); }
    </style>
</head>
<body>

<div id="loader"><div class="logo-ani"></div><h3>EA YOUTH UNION</h3></div>
<header id="appHeader">EA YOUTH UNION</header>

<div class="container">
    <div id="home" class="page active">
        <div class="card" style="background: var(--p); color: white; text-align: center;">
            <h3 id="dailyVerse">"እግዚአብሔር ብርሃኔና መድኃኒቴ ነው"</h3>
            <small id="verseRef" style="color:var(--s);"></small>
        </div>
        <div id="newsFeed"></div>
    </div>

    <div id="songs" class="page">
        <button class="btn-action" style="background:#111; color:white;" onclick="downloadAllAudio()">
            <i class="fas fa-download"></i> ሁሉንም መዝሙሮች ለኦፍላይን አውርድ
        </button>
        <input type="text" id="sSearch" placeholder="መዝሙር ፈልግ..." onkeyup="searchSong(this.value)" style="margin-top:15px;">
        <div id="songList"></div>
    </div>

    <div id="calendar" class="page">
        <div class="card" style="background:var(--p); color:white; text-align:center;"><h2 id="ethDate"></h2></div>
        <div class="card"><h4>የሰንበት ማስታወሻ</h4><input type="time" id="alTime"><button class="btn-action">ደወል መዝግብ</button></div>
    </div>

    <div id="map-page" class="page">
        <div class="card"><div id="map"></div><button class="btn-action" onclick="findSDA()">አቅራቢያ ያሉ አድቬንቲስት ቤተክርስቲያናት</button></div>
    </div>

    <div id="thanks" class="page">
        <div id="galleryFeed"></div>
        <div class="card"><p id="thanksText" style="text-align: center;"></p></div>
        <div style="text-align: center; margin-top: 60px;">
            <span onclick="adminClick()" style="color: black; opacity: 0.02; cursor: pointer; font-size: 20px;">⚫</span>
        </div>
    </div>

    <div id="admin" class="page">
        <div class="card" style="background:#222; color:white;"><h3>የአድሚን መቆጣጠሪያ (Private)</h3></div>
        
        <div class="stat-grid-admin">
            <div class="stat-box"><b>የሃይማኖት ስታት</b><br><span id="relStat">0</span></div>
            <div class="stat-box"><b>የከተማ ስታት</b><br><span id="cityStat">0</span></div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <button class="btn-action" onclick="showAdm('a-news')">ዜና/ጥቅስ</button>
            <button class="btn-action" onclick="showAdm('a-song')">መዝሙር Edit</button>
            <button class="btn-action" onclick="showAdm('a-stat')">Stat Edit</button>
            <button class="btn-action" onclick="showAdm('a-thank')">ምስጋና Edit</button>
        </div>

        <div id="a-news" class="admin-sec"><input id="nT" placeholder="ዜና ርዕስ"><textarea id="nD" placeholder="ዝርዝር"></textarea><input id="vT" placeholder="ጥቅስ"><button class="btn-action" onclick="saveNews()">አዘምን</button></div>
        
        <div id="a-song" class="admin-sec">
            <input id="sN" type="number" placeholder="ቁጥር (No)">
            <input id="sT" placeholder="ርዕስ (Title)">
            <textarea id="sL" placeholder="ግጥም (Lyric)"></textarea>
            <input id="sA" placeholder="Audio URL">
            <button class="btn-action" onclick="saveSong()">መዝሙር አዘምን</button>
        </div>

        <div id="a-stat" class="admin-sec">
            <h4>ስታቲስቲክስ (Private)</h4>
            <input id="relName" placeholder="የሃይማኖት ስም">
            <input id="relCount" type="number" placeholder="ብዛት">
            <hr>
            <input id="cityName" placeholder="የከተማ ስም">
            <input id="cityCount" type="number" placeholder="ብዛት">
            <button class="btn-action" onclick="saveStat()">ስታት አዘምን</button>
        </div>

        <div id="a-thank" class="admin-sec"><input id="tI" placeholder="Image URL"><textarea id="tT" placeholder="ምስጋና ጽሁፍ"></textarea><button class="btn-action" onclick="saveThanks()">ሴቭ</button></div>
    </div>

    <div id="viewer" class="page">
        <div class="card">
            <h2 id="vTi" style="text-align: center; color: var(--p);"></h2>
            <audio id="mainAudio" controls style="width: 100%; margin: 15px 0;"></audio>
            <div id="vLy" style="white-space: pre-line; line-height: 2; font-size: var(--fSize);"></div>
            <button class="btn-action" onclick="showPage('songs')">ተመለስ</button>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="showPage('home', this)"><i class="fas fa-home"></i><span>ቤት</span></div>
    <div class="nav-item" onclick="showPage('songs', this)"><i class="fas fa-music"></i><span>መዝሙር</span></div>
    <div class="nav-item" onclick="showPage('calendar', this)"><i class="fas fa-calendar-alt"></i><span>ቀን</span></div>
    <div class="nav-item" onclick="showPage('map-page', this)"><i class="fas fa-map-marker-alt"></i><span>ካርታ</span></div>
    <div class="nav-item" onclick="showPage('thanks', this)"><i class="fas fa-heart"></i><span>ምስጋና</span></div>
</nav>

<script>
    const firebaseConfig = { databaseURL: "https://ea-youth-union-app-d1358-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let map;
    window.onload = () => {
        setTimeout(() => document.getElementById('loader').style.display='none', 1200);
        ethDate.innerText = new Date().toLocaleDateString('am-ET', {weekday:'long', month:'long', day:'numeric'});
        loadData(); initMap();
    };

    function initMap() {
        try {
            map = L.map('map').setView([9.0192, 38.7525], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        } catch(e) { console.log("Map offline mode"); }
    }

    function findSDA() {
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                const lat = p.coords.latitude, lon = p.coords.longitude;
                map.setView([lat, lon], 14);
                L.marker([lat, lon]).addTo(map).bindPopup("አንተ እዚህ ነህ").openPopup();
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=Seventh+Day+Adventist+Church&limit=5&lat=${lat}&lon=${lon}`)
                .then(r => r.json()).then(d => d.forEach(pl => L.marker([pl.lat, pl.lon]).addTo(map).bindPopup(pl.display_name)));
            });
        }
    }

    function loadData() {
        db.ref('news').on('value', s => { let h = ""; s.forEach(c => h = `<div class="card"><h3>${c.val().title}</h3><p>${c.val().desc}</p></div>` + h); newsFeed.innerHTML = h; });
        db.ref('dailyVerse').on('value', s => { if(s.val()) dailyVerse.innerText = s.val().text; });
        db.ref('songs').orderByChild('no').on('value', s => {
            let h = ""; s.forEach(c => {
                const saved = localStorage.getItem('audio_'+c.val().no) ? ' ✅' : '';
                h += `<div class="card" onclick="openSong('${c.val().title}',\`${c.val().lyric}\`,'${c.val().audio}',${c.val().no})">${c.val().no}. ${c.val().title}${saved}</div>`;
            });
            songList.innerHTML = h;
        });

        // Private Stats Load - Admin only
        db.ref('stats/religion').on('value', s => { relStat.innerText = s.val() ? `${s.val().name}: ${s.val().count}` : "0"; });
        db.ref('stats/city').on('value', s => { cityStat.innerText = s.val() ? `${s.val().name}: ${s.val().count}` : "0"; });
        
        db.ref('thanksData').on('value', s => { if(s.val()){ galleryFeed.innerHTML = `<img src="${s.val().img}" style="width:100%; border-radius:15px;">`; thanksText.innerText = s.val().txt; } });
    }

    async function downloadAllAudio() {
        alert("ዳውንሎድ ተጀምሯል። እባክህ ትንሽ ጠብቅ...");
        db.ref('songs').once('value', s => {
            s.forEach(async c => {
                const d = c.val();
                if(d.audio && !localStorage.getItem('audio_'+d.no)) {
                    try {
                        const res = await fetch(d.audio);
                        const b = await res.blob();
                        const r = new FileReader();
                        r.onloadend = () => localStorage.setItem('audio_'+d.no, r.result);
                        r.readAsDataURL(b);
                    } catch(e) {}
                }
            });
        });
        setTimeout(()=>alert("ተጠናቅቋል!"), 5000);
    }

    function openSong(t, l, a, n) {
        vTi.innerText = t; vLy.innerText = l;
        const saved = localStorage.getItem('audio_'+n);
        if(saved) { mainAudio.src = saved; mainAudio.style.display='block'; }
        else if(a) { mainAudio.src = a; mainAudio.style.display='block'; }
        else { mainAudio.style.display='none'; }
        showPage('viewer');
    }

    function saveSong() { db.ref('songs/'+sN.value).set({no:parseInt(sN.value), title:sT.value, lyric:sL.value, audio:sA.value}); alert("Updated!"); }
    function saveStat() { 
        if(relName.value) db.ref('stats/religion').set({name:relName.value, count:relCount.value});
        if(cityName.value) db.ref('stats/city').set({name:cityName.value, count:cityCount.value});
        alert("Stats Updated!"); 
    }
    function saveThanks() { db.ref('thanksData').set({img:tI.value, txt:tT.value}); alert("Saved!"); }
    function saveNews() { db.ref('news').push({title:nT.value, desc:nD.value}); db.ref('dailyVerse').set({text:vT.value}); alert("Posted!"); }

    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
        if(id === 'map-page' && map) setTimeout(() => map.invalidateSize(), 400);
    }
    function showAdm(id) { document.querySelectorAll('.admin-sec').forEach(s => s.style.display='none'); document.getElementById(id).style.display='block'; }

    let cl = 0; function adminClick() { cl++; if(cl === 3) { if(prompt("Code:") === "ttse9@we33") showPage('admin'); cl = 0; } setTimeout(()=>cl=0, 3000); }
</script>
</body>
</html>
