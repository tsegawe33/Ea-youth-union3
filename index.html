<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EA Youth Union - Ultimate Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { --p: #0a4d1a; --s: #d4af37; --bg: #f4f7f6; --fSize: 18px; }
        body { margin: 0; background: var(--bg); font-family: 'Noto Serif Ethiopic', serif; }
        
        #loader { position: fixed; inset: 0; background: var(--p); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: 0.6s; }
        header { background: var(--p); color: white; padding: 18px; text-align: center; border-bottom: 3px solid var(--s); position: sticky; top: 0; z-index: 1000; font-weight: bold; }
        .container { max-width: 600px; margin: auto; padding: 15px; padding-bottom: 110px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; border-radius: 18px; padding: 20px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .nav-bar { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); width: 94%; background: var(--p); border-radius: 35px; display: flex; justify-content: space-around; padding: 12px; border: 1px solid var(--s); z-index: 2000; }
        .nav-item { color: rgba(255,255,255,0.4); text-align: center; flex:1; cursor: pointer; }
        .nav-item.active { color: var(--s); }

        .btn-action { background: var(--s); color: black; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .admin-sec { display: none; padding: 15px; background: #fff; border-radius: 12px; margin-top: 10px; border: 1px solid #ddd; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        
        /* Secret Admin Button - በጣም ደብዛዛ */
        .secret-btn { opacity: 0.05; color: #000; font-size: 15px; cursor: pointer; padding: 20px; display: inline-block; }
    </style>
</head>
<body>

<div id="loader"><h3>EA YOUTH UNION</h3></div>
<header>EA YOUTH UNION</header>

<div class="container">
    <div id="home" class="page active"><div id="newsFeed"></div></div>
    <div id="songs" class="page">
        <button class="btn-action" onclick="downloadAllAudio()">ሁሉንም መዝሙር አውርድ</button>
        <div id="songList"></div>
    </div>
    <div id="calendar" class="page"><div class="card"><h2 id="ethDate" style="text-align:center;"></h2></div></div>
    <div id="map-page" class="page"><div class="card"><div id="map" style="height:350px;"></div></div></div>
    <div id="thanks" class="page">
        <div id="galleryFeed"></div>
        <div class="card" id="thanksText"></div>
        <div style="text-align: center; margin-top: 50px;">
            <span class="secret-btn" onclick="adminClick()">⚫</span>
        </div>
    </div>

    <div id="admin" class="page">
        <div class="card" style="background: #222; color: white;">
            <h3>Admin Panel <span id="uStat" style="float:right; color:var(--s);">0</span></h3>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <button class="btn-action" onclick="showAdm('a-news')">ዜና</button>
            <button class="btn-action" onclick="showAdm('a-song')">መዝሙር ጨምር</button>
            <button class="btn-action" onclick="showAdm('a-edit-song')">መዝሙር አርም (Edit)</button>
            <button class="btn-action" onclick="showAdm('a-stat')">Stat Edit</button>
        </div>

        <div id="a-news" class="admin-sec">
            <input id="nT" placeholder="ርዕስ"><textarea id="nD" placeholder="ዝርዝር"></textarea><button class="btn-action" onclick="saveNews()">ልቀቅ</button>
        </div>

        <div id="a-song" class="admin-sec">
            <input id="sN" type="number" placeholder="ቁጥር"><input id="sT" placeholder="ርዕስ"><textarea id="sL" placeholder="ግጥም"></textarea><input id="sA" placeholder="Audio Link"><button class="btn-action" onclick="saveSong()">መዝሙር ጨምር</button>
        </div>

        <div id="a-edit-song" class="admin-sec">
            <h4>መዝሙር ለመቀየር እዚህ ይምረጡ</h4>
            <select id="editSelector" onchange="fillEditForm(this.value)" style="width:100%; padding:10px; border-radius:10px;"></select>
            <div id="editFields" style="display:none; margin-top:10px;">
                <input id="eT" placeholder="ርዕስ"><textarea id="eL" placeholder="ግጥም" rows="5"></textarea><input id="eA" placeholder="Audio Link">
                <button class="btn-action" onclick="updateSong()">ለውጡን መዝግብ (Update)</button>
            </div>
        </div>

        <div id="a-stat" class="admin-sec">
            <input id="sVal" type="number" placeholder="የተጠቃሚ ቁጥር"><button class="btn-action" onclick="saveStat()">ቁጥሩን ቀይር</button>
        </div>
    </div>

    <div id="viewer" class="page">
        <div class="card">
            <h2 id="vTi" style="text-align:center; color:var(--p);"></h2>
            <audio id="mainAudio" controls style="width:100%; margin:15px 0;"></audio>
            <div id="vLy" style="white-space:pre-line; line-height:2;"></div>
            <button class="btn-action" onclick="showPage('songs')">ተመለስ</button>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="showPage('home', this)"><i class="fas fa-home"></i></div>
    <div class="nav-item" onclick="showPage('songs', this)"><i class="fas fa-music"></i></div>
    <div class="nav-item" onclick="showPage('calendar', this)"><i class="fas fa-calendar"></i></div>
    <div class="nav-item" onclick="showPage('map-page', this)"><i class="fas fa-map-marker-alt"></i></div>
    <div class="nav-item" onclick="showPage('thanks', this)"><i class="fas fa-heart"></i></div>
</nav>

<script>
    const firebaseConfig = { databaseURL: "https://ea-youth-union-app-d1358-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    window.onload = () => {
        setTimeout(() => document.getElementById('loader').style.display='none', 1200);
        ethDate.innerText = new Date().toLocaleDateString('am-ET', {weekday:'long', month:'long', day:'numeric'});
        loadData();
    };

    let allSongs = {};
    function loadData() {
        db.ref('news').on('value', s => { let h = ""; s.forEach(c => h = `<div class="card"><h3>${c.val().title}</h3><p>${c.val().desc}</p></div>` + h); newsFeed.innerHTML = h; });
        
        db.ref('songs').on('value', s => {
            let h = "", opt = "<option value=''>መዝሙር ይምረጡ...</option>";
            allSongs = {};
            s.forEach(c => {
                const data = c.val();
                allSongs[c.key] = data;
                h += `<div class="card" onclick="openSong('${data.title}',\`${data.lyric}\`,'${data.audio}')">${data.no}. ${data.title}</div>`;
                opt += `<option value="${c.key}">${data.no}. ${data.title}</option>`;
            });
            songList.innerHTML = h;
            editSelector.innerHTML = opt;
        });

        db.ref('stats/count').on('value', s => uStat.innerText = s.val() || 0);
    }

    function fillEditForm(id) {
        if(!id) return document.getElementById('editFields').style.display='none';
        const s = allSongs[id];
        eT.value = s.title; eL.value = s.lyric; eA.value = s.audio || "";
        document.getElementById('editFields').style.display='block';
    }

    function updateSong() {
        const id = editSelector.value;
        db.ref('songs/' + id).update({ title: eT.value, lyric: eL.value, audio: eA.value })
        .then(() => { alert("መዝሙሩ ተስተካክሏል!"); showAdm('a-edit-song'); });
    }

    function saveSong() {
        db.ref('songs').push({ no: parseInt(sN.value), title: sT.value, lyric: sL.value, audio: sA.value });
        alert("መዝሙር ተጨምሯል!");
    }

    function openSong(t, l, a) {
        vTi.innerText = t; vLy.innerText = l;
        if(a) { mainAudio.src = a; mainAudio.style.display='block'; } else { mainAudio.style.display='none'; }
        showPage('viewer');
    }

    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
    }

    function showAdm(id) { document.querySelectorAll('.admin-sec').forEach(s => s.style.display='none'); document.getElementById(id).style.display='block'; }
    function saveStat() { db.ref('stats').set({count: parseInt(sVal.value)}); alert("ቁጥሩ ተቀይሯል!"); }

    let cl = 0; function adminClick() { cl++; if(cl === 3) { if(prompt("Code:") === "ttse9@we33") showPage('admin'); cl = 0; } setTimeout(()=>cl=0, 3000); }
</script>
</body>
</html>
